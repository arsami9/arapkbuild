
name: ARAPKBUILD Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed ARAPKBUILD APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout source code
      - name: Checkout ARAPKBUILD Project
        uses: actions/checkout@v5

      # 2. Setup Java 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Check Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # 4. Download Gradle 8.9
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      # 5. Generate Android project
      - name: Generate ARAPKBUILD Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/arapkbuild/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ARAPKBUILD"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.arapkbuild.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.arapkbuild.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:label="ARAPKBUILD"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/arapkbuild/app/MainActivity.java <<'EOF'
          package com.arapkbuild.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # Copy actual website project
          if [ -f web-project/index.html ]; then
              cp -r web-project/. app/src/main/assets/
              echo "Website files copied into Android assets."
          elif [ -f index.html ]; then
              cp index.html app/src/main/assets/index.html
              echo "Root index.html copied into Android assets."
          else
              echo "::warning::Website files not found. Creating demo page."

              cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>ARAPKBUILD</title>
              <style>
                  body {
                      background: #101827;
                      color: white;
                      font-family: Arial, sans-serif;
                      text-align: center;
                      padding: 40px 15px;
                  }
                  h1 { color: #54e0bb; }
              </style>
          </head>
          <body>
              <h1>ARAPKBUILD</h1>
              <p>Your Android application is ready.</p>
          </body>
          </html>
          EOF
          fi

      # 6. Compile Release APK
      - name: Compile Android Release APK
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease

      # 7. Generate temporary signing key
      - name: Generate APK Signing Key
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/arapkbuild-release.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias arapkbuild \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=ARAPKBUILD, OU=Android, O=ARAPKBUILD, L=Dhaka, ST=Dhaka, C=BD"

          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          echo "Signing key generated."

      # 8. Sign APK using V1 and V2
      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/arapkbuild-release.apk"

          test -s "$UNSIGNED_APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias arapkbuild \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          test -s "$SIGNED_APK"

          echo "APK signing completed."

      # 9. Verify APK signature
      - name: Verify APK V1 and V2 Signatures
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/arapkbuild-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification completed."

      # 10. Upload final APK
      - name: Upload ARAPKBUILD APK
        uses: actions/upload-artifact@v5
        with:
          name: arapkbuild-release-apk
          path: app/build/outputs/apk/release/arapkbuild-release.apk
          if-no-files-found: error
          retention-days: 7
