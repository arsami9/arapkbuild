name: ARAPKBUILD Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed ARAPKBUILD APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download source code
      - name: Checkout ARAPKBUILD
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
    
 - name: Use Preinstalled Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK is ready."
  # 4. Setup Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # 5. Check signing secrets
      - name: Check Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub Secret: $secret"
              exit 1
            fi
          done

          echo "All signing secrets are configured."

      # 6. Create Android project
      - name: Generate ARAPKBUILD Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/arapkbuild/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ARAPKBUILD"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.arapkbuild.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.arapkbuild.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")

                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:label="ARAPKBUILD"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/arapkbuild/app/MainActivity.java <<'EOF'
          package com.arapkbuild.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }
          }
          EOF

          # Copy the user's website files into Android assets
          if [ -f web-project/index.html ]; then
              cp -r web-project/. app/src/main/assets/
              echo "Website project copied successfully."
          else
              echo "::warning::web-project/index.html not found. Creating a demo page."

              cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport"
                    content="width=device-width, initial-scale=1.0">
              <title>ARAPKBUILD</title>
              <style>
                  body {
                      background: #101827;
                      color: white;
                      font-family: Arial, sans-serif;
                      text-align: center;
                      padding: 40px 15px;
                  }
                  h1 { color: #54e0bb; }
              </style>
          </head>
          <body>
              <h1>ARAPKBUILD</h1>
              <p>Your Android application is ready.</p>
          </body>
          </html>
          EOF
          fi

      # 7. Restore permanent signing key
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/arapkbuild-release.jks"

          test -s "$RUNNER_TEMP/arapkbuild-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/arapkbuild-release.jks" \
            >> "$GITHUB_ENV"

      # 8. Build signed Release APK
      - name: Compile Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease

      # 9. Verify APK and signatures
      - name: Verify APK V1 and V2 Signatures
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          echo "APK signature verification completed."

      # 10. Upload final APK
      - name: Upload ARAPKBUILD Release APK
        uses: actions/upload-artifact@v5
        with:
          name: arapkbuild-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
