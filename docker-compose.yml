
services:
  arapkbuild-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: arapkbuild-server
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      NODE_ENV: production
      PORT: 8080

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      RETENTION_HOURS: ${RETENTION_HOURS:-12}
      BUILDS_PER_IP_PER_HOUR: ${BUILDS_PER_IP_PER_HOUR:-10}

      WORK_DIR: /tmp/arapkbuild-builds

      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_BUILD_TOOLS: /opt/android-sdk/build-tools/35.0.0

    volumes:
      - arapkbuild-builds:/tmp/arapkbuild-builds

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  arapkbuild-builds:
