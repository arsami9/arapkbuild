<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1022">
<meta name="description" content="Responsive Android APK builder for mobile and desktop browsers">
<title>AR APK BUILD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: persistent left rail + sticky top bar + content column. Mobile swaps the rail for a drawer and a bottom nav.
   Boldness lives in one place: the dark blueprint hero with the build-conveyor canvas. Everything else stays quiet. */
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --surface2:#F5F7FC; --ink:#0B1124; --muted:#5A6482; --line:#DCE1EE;
  --accent:#2F4BFF; --accent-soft:#E6EAFF; --signal:#FF5A36; --good:#0E9F55; --warn:#B87400; --bad:#D4304A;
  --hero:#0A1022; --hero-line:rgba(130,150,255,.14);
  --shadow:0 1px 2px rgba(11,17,36,.06),0 10px 28px rgba(11,17,36,.07);
  --code-bg:#F7F9FE; --code-fg:#1B2340; --code-gut:#8A93B2; --c-kw:#6B3FD6; --c-str:#0E7A4A; --c-com:#8A93B2; --c-num:#C2410C; --c-tag:#1F44E0; --c-attr:#B4256B; --c-fn:#0B6FA8; --c-type:#A15C00;
  --f-display:'Unbounded','Trebuchet MS',sans-serif; --f-body:'Manrope','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B18; --surface:#0E152E; --surface2:#131C3B; --ink:#E9EDFB; --muted:#8F9ABF; --line:#222C54;
  --accent:#6580FF; --accent-soft:#18225A; --signal:#FF7A59; --good:#34D17E; --warn:#F0B33A; --bad:#FF6B80;
  --hero:#050914; --hero-line:rgba(130,150,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --code-bg:#0A1022; --code-fg:#D6DDF5; --code-gut:#5C6690; --c-kw:#B497FF; --c-str:#5FE0A1; --c-com:#667096; --c-num:#FFA779; --c-tag:#7C95FF; --c-attr:#FF8FC1; --c-fn:#6CCBFF; --c-type:#F2C46D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B18; --surface:#0E152E; --surface2:#131C3B; --ink:#E9EDFB; --muted:#8F9ABF; --line:#222C54;
  --accent:#6580FF; --accent-soft:#18225A; --signal:#FF7A59; --good:#34D17E; --warn:#F0B33A; --bad:#FF6B80;
  --hero:#050914; --hero-line:rgba(130,150,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --code-bg:#0A1022; --code-fg:#D6DDF5; --code-gut:#5C6690; --c-kw:#B497FF; --c-str:#5FE0A1; --c-com:#667096; --c-num:#FFA779; --c-tag:#7C95FF; --c-attr:#FF8FC1; --c-fn:#6CCBFF; --c-type:#F2C46D;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--surface)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
small{color:var(--muted)}
code,.mono{font-family:var(--f-mono)}

/* Explicit responsive mode switch: Auto follows device width, Mobile and Desktop are user-selectable. */
html[data-layout="mobile"] .app{grid-template-columns:minmax(0,1fr)}
html[data-layout="mobile"] .side{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;height:auto;width:min(290px,84vw);z-index:95;transform:translateX(-105%);transition:transform .26s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 60px rgba(0,0,0,.4)}
html[data-layout="mobile"] .side.open{transform:none}
html[data-layout="mobile"] .scrim.open{display:block;position:fixed;inset:0;z-index:94;background:rgba(5,9,22,.5)}
html[data-layout="mobile"] .menu-btn{display:grid}
html[data-layout="mobile"] .page{padding-bottom:104px}
html[data-layout="mobile"] .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
html[data-layout="mobile"] .bnav a,html[data-layout="mobile"] .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:700;padding:4px 0}
html[data-layout="mobile"] .auth{grid-template-columns:1fr}
html[data-layout="desktop"] .app{grid-template-columns:262px minmax(0,1fr)}
html[data-layout="desktop"] .side{position:sticky;top:0;height:100vh;transform:none}
html[data-layout="desktop"] .menu-btn,html[data-layout="desktop"] .bnav{display:none!important}
html[data-layout="desktop"] .scrim{display:none!important}
.layout-select{height:36px;max-width:120px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 7px;font-size:11px;font-weight:700}
@media(max-width:959px){html[data-layout="desktop"] .page{padding-left:12px;padding-right:12px}html[data-layout="desktop"] .app{grid-template-columns:210px minmax(0,1fr)}html[data-layout="desktop"] .side{position:sticky;transform:none;width:auto;height:100vh;z-index:2}}

/* shell */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);padding:2px 6px}
.brand b{font-family:var(--f-display);font-size:15px;letter-spacing:-.01em;line-height:1.1;display:block}
.brand i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);min-width:0}
.ucard>div{min-width:0}.ucard b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ucard small{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard.guest{justify-content:space-between}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),var(--signal));color:#fff;font-weight:800;font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13.5px}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav.admin{color:var(--signal)}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);max-width:420px}
.search input{border:0;background:none;outline:0;min-width:0;width:100%;color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--ink)}
.menu-btn{display:none}
.page{padding:22px 16px 40px;width:100%;max-width:1200px;margin:0 auto}
.scrim{display:none}
.bnav{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn-lg{min-height:50px;font-size:15px;border-radius:14px}
.btn-primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn-signal{background:var(--signal);border-color:transparent;color:#fff}
.btn-danger{color:var(--bad)}
.btn-block{width:100%}
.btn-white{background:#fff;color:#1A2BD0;border-color:transparent;min-height:50px;font-size:15px}
.btn-glass{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);color:#fff;min-height:50px;font-size:15px;backdrop-filter:blur(6px)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;min-height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);outline:0;transition:border-color .15s,box-shadow .15s}
textarea.input{padding:11px 13px;min-height:84px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);background:var(--surface)}
.input.bad{border-color:var(--bad)}
.hint{font-size:11.5px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pw{position:relative}.pw .input{padding-right:46px}.pw button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:10px}
.meter{display:flex;gap:4px;margin-top:2px}.meter i{flex:1;height:4px;border-radius:3px;background:var(--line)}.meter i.on{background:var(--bad)}.meter[data-s="3"] i.on,.meter[data-s="4"] i.on{background:var(--good)}.meter[data-s="2"] i.on{background:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.03em;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:transparent}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:transparent}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:transparent}
.badge.info{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-h h2{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-h a,.linkbtn{font-weight:800;font-size:13px;color:var(--accent);background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:4px}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.phead h1{font-family:var(--f-display);font-size:clamp(20px,4.2vw,28px);letter-spacing:-.02em;line-height:1.15}
.phead p{color:var(--muted);margin-top:2px}
.pico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 20px;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--f-display);font-size:16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:16px;font-weight:600}
.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--hero);color:#fff;padding:28px 22px 24px;isolation:isolate;min-height:300px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-in{position:relative;width:100%}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9FB0FF;margin-bottom:10px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5.4vw,44px);line-height:1.1;letter-spacing:-.025em;text-wrap:balance;max-width:16ch;margin-bottom:10px}
.hero p{color:#B4C0E8;max-width:44ch;margin-bottom:20px}
.hero-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.stat{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.stat .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-family:var(--f-display);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{display:block}
.si.a{background:var(--accent-soft);color:var(--accent)}.si.g{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}.si.w{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}.si.s{background:color-mix(in srgb,var(--signal) 14%,var(--surface));color:var(--signal)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.step i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.step h3{font-size:15px;margin:6px 0 4px}.step p{color:var(--muted);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feat{display:flex;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.feat .pico{width:38px;height:38px;border-radius:12px}.feat b{display:block;font-size:13.5px}.feat small{font-size:12.5px}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pnew{display:grid;place-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:20px;background:transparent;color:var(--muted);min-height:200px;font-weight:700}
.pnew:hover{border-color:var(--accent);color:var(--accent)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.cover{--c1:#4F6BFF;--c2:#2236C9;--cov:#2236C9;position:relative;height:118px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2))}
.cover svg{width:66px;height:66px;opacity:.94}
.cv-html{--c1:#5B74FF;--c2:#2437C7;--cov:#2437C7}.cv-blank{--c1:#7A6BF0;--c2:#4A33B8;--cov:#4A33B8}.cv-native{--c1:#2FC17D;--c2:#0E7C53;--cov:#0E7C53}.cv-webview{--c1:#FF8A5C;--c2:#D93E1E;--cov:#D93E1E}
.tbadge{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;background:rgba(10,16,34,.55);color:#fff;border-radius:99px;padding:3px 9px}
.fcount{position:absolute;left:10px;bottom:9px;font-size:11px;color:#fff;opacity:.9;font-weight:700}
.pbody{padding:12px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pbody h3{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody small{display:flex;align-items:center;gap:5px;font-size:12px}
.prow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:4px}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bitem .grow{flex:1;min-width:0}.bitem b{display:block;font-size:13.5px}.bitem small{font-size:12px}

/* modal / toast */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(5,9,22,.58);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .18s ease}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.mh h2{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:block;cursor:pointer}.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;text-align:center;border:1.5px solid var(--line);border-radius:16px;background:var(--surface2);height:100%}
.opt span em{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface);color:var(--muted);font-style:normal;margin-bottom:2px}
.opt span b{font-size:14px}.opt span small{font-size:12px}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}.opt input:checked+span em{color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#0B1124;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:8px;align-items:center;animation:rise .25s ease;max-width:440px}
.toast.err{background:#B3243C}.toast.ok{background:#0B6B3A}
#fx{position:fixed;inset:0;pointer-events:none;z-index:130;width:100%;height:100%}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.25}}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.auth-art{position:relative;background:var(--hero);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.auth-art h2{font-family:var(--f-display);font-size:clamp(24px,3.4vw,38px);line-height:1.12;letter-spacing:-.02em;max-width:14ch;margin:0 0 10px}
.auth-art p{color:#B4C0E8;max-width:38ch}
.auth-art .brand{color:#fff}.auth-art .brand i{color:#9FB0FF}
.auth-form{display:grid;place-items:center;padding:28px 16px;background:var(--bg)}
.auth-box{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.auth-box h1{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(11,17,36,.12)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted)}.chk input{margin-top:3px;accent-color:var(--accent)}

/* build page */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.bform{display:flex;flex-direction:column;gap:14px;min-width:0}
.bside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:12px}
.bsec{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.bsec>header,.bsec>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;font-size:14px;background:var(--surface2);list-style:none;cursor:default}
details.bsec>summary{cursor:pointer}
.bsec>summary::-webkit-details-marker{display:none}
.bsec header i,.bsec summary i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.bsec summary .opt-t{font-weight:600;color:var(--muted);font-size:12px;margin-left:auto;display:flex;align-items:center;gap:6px}
.bbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.grp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.tgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);cursor:pointer;min-width:0}
.tg>span{min-width:0}.tg b{display:block;font-size:13px}.tg small{font-size:11.5px;display:block}
.tg.on{border-color:var(--accent);background:var(--accent-soft)}
.tg input{position:absolute;opacity:0;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked~.sw{background:var(--accent)}.tg input:checked~.sw::after{transform:translateX(18px)}
.tg input:focus-visible~.sw{outline:2px solid var(--accent);outline-offset:2px}
.tg.locked{opacity:.75}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:112px;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface2);cursor:pointer;text-align:center;font-size:12px;color:var(--muted);padding:10px}
.upl img{width:56px;height:56px;border-radius:14px;object-fit:cover}.upl b{color:var(--ink);font-size:12.5px}
.upl:hover{border-color:var(--accent)}
.colorrow{display:flex;gap:10px;align-items:center}.colorrow input[type=color]{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:3px;flex:none}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pv-ic{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;overflow:hidden;color:#fff;font-family:var(--f-display);font-size:28px;margin-bottom:4px}
.pv-ic img{width:100%;height:100%;object-fit:cover}
.pv b{font-size:15px}.pv code{font-size:11px;color:var(--muted);word-break:break-all}
.pv dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:10px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.pv dt{font-size:10.5px;color:var(--muted)}.pv dd{margin:0;font-weight:800;font-size:12.5px}
.pv .deep{width:100%;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:7px 8px;word-break:break-all}
.proflag{font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:6px}

/* console */
.cons{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cstat{position:relative;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#3149F0,#1B2AB0);overflow:hidden}
.cstat.fail{background:linear-gradient(135deg,#C02A45,#7A1429)}
.cstat h2{font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.cstat p{opacity:.8;font-size:12.5px}
.cstat .tm{position:absolute;right:16px;top:16px;font-family:var(--f-mono);background:rgba(255,255,255,.16);padding:5px 10px;border-radius:10px;font-size:13px}
.cstat .live{position:absolute;right:20px;top:48px;font-size:10px;letter-spacing:.14em;opacity:.85}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .9s linear infinite;flex:none}
.chead{display:flex;gap:14px;align-items:center;margin-bottom:18px;padding-right:90px}
.track{display:flex;align-items:flex-start}
.tn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;font-weight:700;opacity:.65}
.tn::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.3)}
.tn:first-child::before{display:none}
.tn i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;position:relative;z-index:1}
.tn.done{opacity:1}.tn.done i{background:#fff;color:#2036D8}.tn.done::before{background:#fff}
.tn.now{opacity:1}.tn.now i{background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.25)}
.term{background:#0A0F1F;border-radius:16px;overflow:hidden;border:1px solid #1B2548}
.term header{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#10172F}
.term header i{width:10px;height:10px;border-radius:50%}
.term header span{font-family:var(--f-mono);font-size:11px;color:#8590B8;margin-right:auto;margin-left:6px}
.term header button{background:#1A2348;border:0;border-radius:7px;color:#9AA5CC;font-family:var(--f-mono);font-size:10.5px;padding:4px 8px}
.tlog{padding:12px 14px;font-family:var(--f-mono);font-size:11.5px;line-height:1.75;color:#C5CDEE;max-height:260px;overflow:auto}
.tlog span{color:#566090;margin-right:8px}.tlog .e{color:#FF8CA0}.tlog .ok{color:#5FE0A1}
.demo-note{font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.done-modal{padding:0;overflow:hidden;width:min(380px,100%)}
.dm-top{background:linear-gradient(135deg,#1FBF72,#0F8F50);color:#fff;text-align:center;padding:26px 20px 34px}
.dm-top .pico{background:rgba(255,255,255,.2);color:#fff;margin:0 auto 10px;width:58px;height:58px;border-radius:18px}
.dm-top small{color:#fff;opacity:.8;letter-spacing:.14em;font-weight:800;font-size:10.5px}.dm-top h2{font-family:var(--f-display);font-size:20px}
.dm-body{background:var(--surface);margin-top:-18px;border-radius:20px 20px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right;word-break:break-all}

/* editor */
.edtool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.edtool .nm{font-weight:800;font-size:13.5px;margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0}
.edtool .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.edshell{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);height:calc(100vh - 150px);min-height:520px}
.edcol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.files{display:none;overflow:auto;background:var(--surface2);border-bottom:1px solid var(--line);max-height:190px;padding:8px}
.edshell.f .files{display:block}
.files h4{margin:4px 6px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.fl{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;font-size:12.5px;font-family:var(--f-mono);cursor:pointer;color:var(--muted)}
.fl.on{background:var(--accent-soft);color:var(--accent)}
.fl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl button{border:0;background:none;color:var(--muted);padding:2px;display:grid;place-items:center;border-radius:6px}.fl button:hover{color:var(--bad)}
.panes{flex:1;min-height:0;display:flex}
.codepane,.prevpane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.edshell[data-pane="code"] .prevpane{display:none}.edshell[data-pane="prev"] .codepane{display:none}
.tabs{display:flex;overflow-x:auto;background:var(--surface2);border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;padding:9px 12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer;flex:none}
.tab.on{background:var(--code-bg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tab button{border:0;background:none;color:inherit;opacity:.6;padding:0;display:grid}
.ed{--fs:13px;flex:1;min-height:0;display:flex;background:var(--code-bg);position:relative;font:var(--fs)/calc(var(--fs)*1.65) var(--f-mono)}
.gut{width:44px;flex:none;overflow:hidden;color:var(--code-gut);text-align:right;padding:12px 8px 12px 0;white-space:pre;user-select:none;border-right:1px solid var(--line)}
.stack{position:relative;flex:1;min-width:0}
.stack pre,.stack textarea{position:absolute;inset:0;margin:0;padding:12px;font:inherit;tab-size:2;white-space:pre;border:0;width:100%;height:100%}
.stack pre{overflow:hidden;color:var(--code-fg);pointer-events:none}
.stack textarea{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);resize:none;outline:0;overflow:auto}
.binfile{display:grid;place-items:center;flex:1;color:var(--muted);text-align:center;padding:20px;gap:8px}
.t-kw{color:var(--c-kw)}.t-str{color:var(--c-str)}.t-com{color:var(--c-com);font-style:italic}.t-num{color:var(--c-num)}.t-tag{color:var(--c-tag)}.t-attr{color:var(--c-attr)}.t-fn{color:var(--c-fn)}.t-type{color:var(--c-type)}
.pvhead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12px;font-weight:800}
.pvhead span{margin-right:auto;display:flex;align-items:center;gap:7px}
.pvhead .live{width:7px;height:7px;border-radius:50%;background:var(--good);animation:blink 1.6s infinite}
.pvstage{flex:1;min-height:0;display:grid;place-items:stretch;background:repeating-conic-gradient(var(--surface2) 0 25%,var(--bg) 0 50%) 0 0/18px 18px;overflow:auto}
.pvstage iframe{border:0;background:#fff;width:100%;height:100%}
.pvstage.dev{place-items:center;padding:14px}
.pvstage.dev iframe{width:360px;max-width:100%;height:min(640px,100%);border-radius:28px;border:8px solid #10162E;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.cons-p{max-height:130px;overflow:auto;background:var(--code-bg);border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;padding:8px 10px;color:var(--code-fg)}
.cons-p div{padding:2px 0}.cons-p .error{color:var(--bad)}.cons-p .warn{color:var(--warn)}
.nativebox{padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.tree{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.9;overflow:auto}

/* store, tables, misc */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.tart{height:120px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative}
.tart .ic{width:44px;height:44px;opacity:.92}.tart .tbadge{left:10px;right:auto}
.tinfo{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.tinfo h3{font-size:15px}.tinfo p{color:var(--muted);font-size:12.5px;flex:1}
.tinfo .prow{grid-template-columns:1fr 1fr}
.feature{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:20px;border-radius:22px;background:var(--hero);color:#fff;margin-bottom:16px;flex-wrap:wrap}
.feature h2{font-family:var(--f-display);font-size:18px;margin-bottom:4px}.feature p{color:#B4C0E8;max-width:46ch}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td.act .btn{margin-left:4px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.plan.hot{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.plan h3{font-family:var(--f-display);font-size:16px}.plan .pr{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em}.plan .pr small{font-family:var(--f-body);font-size:13px}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;flex:1}.plan li{display:flex;gap:8px;font-size:13px}.plan li .ic{color:var(--good);margin-top:2px}
.walletcard{background:var(--hero);color:#fff;border-radius:24px;padding:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.walletcard small{color:#9FB0FF;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.walletcard b{display:block;font-family:var(--f-display);font-size:34px;letter-spacing:-.02em}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
.atabs button{flex:none;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.atabs button.on{background:var(--accent);border-color:transparent;color:#fff}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.hbar{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.hbar div{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar span{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.faq{display:flex;flex-direction:column;gap:8px}.faq details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}.faq summary{cursor:pointer;padding:13px 0;font-weight:700}.faq p{padding:0 0 13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.tool h3{font-size:15px}.tool p{color:var(--muted);font-size:13px;flex:1}
.pre{font-family:var(--f-mono);font-size:11.5px;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;white-space:pre;max-height:340px}

@media (max-width:1099px){.bgrid{grid-template-columns:minmax(0,1fr)}.bside{position:static;order:-1}.plans{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}}
@media (min-width:1100px){
  .edshell{flex-direction:row}
  .edshell .edcol{flex:1;min-width:0;display:flex;flex-direction:column}
  .files{display:block;width:200px;max-height:none;border-bottom:0;border-right:1px solid var(--line);flex:none}
  .edshell[data-pane="code"] .prevpane,.edshell[data-pane="prev"] .codepane{display:flex}
  .prevpane{border-left:1px solid var(--line)}
  .panes{flex:1}
  .paneseg{display:none}
}
@media (max-width:959px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;height:auto;width:min(290px,84vw);z-index:95;transform:translateX(-105%);transition:transform .26s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 60px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:94;background:rgba(5,9,22,.5);animation:fade .2s}
  .menu-btn{display:grid}
  .page{padding-bottom:104px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:700;padding:4px 0}
  .bnav .on{color:var(--accent)}
  .bnav .mid span{width:44px;height:44px;margin-top:-18px;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .auth{grid-template-columns:1fr}.auth-art{min-height:240px;padding:24px}
  .steps,.feats{grid-template-columns:1fr}
  .edshell{height:calc(100vh - 160px)}
}
@media (max-width:560px){.tgs,.row2{grid-template-columns:1fr}.hero{padding:22px 16px 18px}.stat b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.chart .bar{fill:var(--accent)}.chart .bar.f{fill:var(--bad)}.chart .gl{stroke:var(--line);stroke-width:1}
.hbar span b{font-weight:700;text-transform:capitalize}
</style>

<input type="file" id="filein" multiple hidden>

<script>
'use strict';
/* ---------- starter files & store templates ---------- */
const page=(t,css,body,js)=>'<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>'+t+'</title>\n<style>\n'+css+'\n</style>\n</head>\n<body>\n'+body+'\n<script>\n'+js+'\n<\/script>\n</body>\n</html>\n';

const T_CALC=page('Calculator',
`*{box-sizing:border-box;margin:0}
body{background:#10131f;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;justify-content:flex-end;min-height:100vh;padding:16px}
#exp{color:#8a93b5;text-align:right;min-height:24px}
#out{font-size:54px;text-align:right;padding:6px 8px 22px;word-break:break-all}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:18px;padding:20px 0;font-size:22px;background:#1b2036;color:#fff}
button.op{background:#2f4bff}button.fn{background:#2a3050}button.eq{background:#ff5a36}`,
'<div id="exp"></div><div id="out">0</div><div class="g" id="g"></div>',
`var keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
var cur='',g=document.getElementById('g'),out=document.getElementById('out'),exp=document.getElementById('exp');
keys.forEach(function(k){var b=document.createElement('button');b.textContent=k;
  if('÷×−+'.indexOf(k)>-1)b.className='op';else if(k==='=')b.className='eq';else if('C±%⌫'.indexOf(k)>-1)b.className='fn';
  b.onclick=function(){press(k)};g.appendChild(b)});
function calc(s){
  var raw=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').match(/[0-9.]+|[-+*/]/g);
  if(!raw)return '';var t=[],i;
  for(i=0;i<raw.length;i++){
    if(raw[i]==='-'&&(i===0||'+-*/'.indexOf(raw[i-1])>-1)&&i+1<raw.length){t.push(String(-raw[i+1]));i++}else t.push(raw[i]);
  }
  for(i=1;i<t.length-1;){
    if(t[i]==='*'||t[i]==='/'){var op=t[i],a=+t[i-1],b=+t[i+1];t.splice(i-1,3,String(op==='*'?a*b:a/b))}else i+=2;
  }
  var r=+t[0];for(i=1;i<t.length;i+=2){r=t[i]==='+'?r+(+t[i+1]):r-(+t[i+1])}
  return isFinite(r)?String(+r.toFixed(8)):'Error';
}
function press(k){
  if(k==='C'){cur='';exp.textContent=''}
  else if(k==='⌫'){cur=cur.slice(0,-1)}
  else if(k==='%'){var v=parseFloat(cur);if(!isNaN(v))cur=String(v/100)}

  else if(k==='='){exp.textContent=cur;cur=calc(cur);out.textContent=cur||'0';if(cur==='Error')cur='';return}
  else cur+=k;
  out.textContent=cur||'0';
}`);

`var cv=document.getElementById('c'),x=cv.getContext('2d'),N=15,S=20,sn,dir,food,score=0,best=0;

  x.fillStyle='#0d1226';x.fillRect(0,0,300,300);

function step(){
  var h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(function(p){return p.x===h.x&&p.y===h.y})){best=Math.max(best,score);reset();draw();return}

reset();draw();setInterval(step,130);`);

    c.strokeStyle='rgba(130,150,255,.1)';c.lineWidth=1;const off=(t*.3)%32;
    for(let x=-off;x<W;x+=32){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
    for(let y=-off;y<H;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
    const [cx,cy]=ctr(),s=Math.max(30,Math.min(W,H)*.15);
    if(!reduce&&t%38===0&&chips.length<9)spawn();
    c.font='500 11px JetBrains Mono,monospace';c.textAlign='left';
    chips=chips.filter(ch=>{
      ch.p+=ch.sp;if(ch.p>=1){pulse=1;if(Math.random()<.4)pills.push({x:cx,y:cy-s,a:1});return false}
      const e=ch.p*ch.p*(3-2*ch.p),x=ch.x0+(cx-ch.x0)*e,y=ch.y0+(cy-ch.y0)*e+Math.sin(t*.05+ch.w)*5,k=1-ch.p*.7,wd=(ch.n.length*6.6+22)*k;
      c.globalAlpha=Math.min(1,(1-ch.p)*1.6)*.9;c.fillStyle='rgba(15,22,52,.92)';c.strokeStyle=ch.c;c.lineWidth=1;
      c.beginPath();c.roundRect?c.roundRect(x-wd/2,y-10*k,wd,20*k,7*k):c.rect(x-wd/2,y-10*k,wd,20*k);c.fill();c.stroke();
      c.fillStyle=ch.c;c.save();c.translate(x,y+4*k);c.scale(k,k);c.textAlign='center';c.fillText(ch.n,0,0);c.restore();c.globalAlpha=1;return true;
    });
    cube(cx,cy,s);
    pills=pills.filter(p=>{p.y-=.7;p.x+=.25;p.a-=.008;if(p.a<=0)return false;c.globalAlpha=p.a;c.fillStyle='#14B86B';c.beginPath();c.roundRect?c.roundRect(p.x-34,p.y-10,68,20,10):c.rect(p.x-34,p.y-10,68,20);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText('app.apk ✓',p.x,p.y+4);c.globalAlpha=1;return true});
    if(!reduce)requestAnimationFrame(frame);
  }
  size();for(let i=0;i<5;i++){spawn();chips[i].p=i*.17}
  const onR=()=>{if(!cv.isConnected){removeEventListener('resize',onR);return}size()};
  addEventListener('resize',onR);
  frame();
}

/* ---------- zip, files, projects ---------- */
const TEXT_EXT=/\.(html?|css|js|mjs|json|xml|txt|md|kt|kts|java|gradle|properties|svg|csv|yml|yaml|pro|cfg|ini|sh|bat)$/i;
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',ico:'image/x-icon',svg:'image/svg+xml',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',mp4:'video/mp4',ttf:'font/ttf',woff:'font/woff',woff2:'font/woff2',otf:'font/otf'};
const mimeOf=n=>MIME[(n.split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const fsort=(a,b)=>a==='index.html'?-1:b==='index.html'?1:a.localeCompare(b);
const bytesOf=files=>Object.values(files).reduce((s,c)=>s+(isBin(c)?Math.floor((c.length-c.indexOf(',')-1)*.75):new Blob([c]).size),0);
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2500)}
const needZip=()=>{if(typeof JSZip==='undefined'){toast('The ZIP library did not load. Check your connection and reload.','err');return false}return true};
async function zipOf(files,extra){
  const z=new JSZip();
  for(const n in files){const c=files[n];if(isBin(c))z.file(n,c.split(',')[1],{base64:true});else z.file(n,c)}
  for(const n in (extra||{}))z.file(n,extra[n]);
  return z.generateAsync({type:'blob',compression:'DEFLATE'});
}
async function readFileAny(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(r.error);r.onload=()=>res(r.result);TEXT_EXT.test(f.name)?r.readAsText(f):r.readAsDataURL(f)})}
function newProjectObj(o){
  const p={id:uid(),owner:owner(),name:o.name,type:o.type,pkg:o.pkg||'com.'+slug(o.name)+'.app',created:now(),updated:now(),files:o.files};
  db.projects.push(p);save();return p;
}
function openProject(id,tab){S.cur=id;S.tab=tab||null;S.open=[];S.saved=true;S.filesOpen=false;go('editor')}
async function importZip(file){
  if(!file)return;
  if(!/\.zip$/i.test(file.name)){toast('Choose a .zip file.','err');return}
  if(file.size>25*1048576){toast('That ZIP is larger than 25 MB.','err');return}
  if(!needZip())return;
  try{
    const z=await JSZip.loadAsync(file);
    let entries=Object.values(z.files).filter(f=>!f.dir&&!/(^|\/)(__MACOSX|\.git|node_modules)\//.test(f.name)&&!/\.DS_Store$/.test(f.name));
    if(!entries.length){toast('That ZIP is empty.','err');return}
    const roots=new Set(entries.map(f=>f.name.split('/')[0]));
    const strip=roots.size===1&&entries.every(f=>f.name.includes('/'))?[...roots][0]+'/':'';
    const files={};let total=0;
    for(const f of entries.slice(0,500)){
      const n=f.name.slice(strip.length);if(!n)continue;
      if(TEXT_EXT.test(n)){files[n]=await f.async('string')}else{files[n]='data:'+mimeOf(n)+';base64,'+await f.async('base64')}
      total+=files[n].length;if(total>12*1048576){toast('Project is too large to store in the browser (12 MB limit).','err');return}
    }
    const names=Object.keys(files);
    const type=names.some(n=>/\.(kt|java)$/.test(n)||/AndroidManifest\.xml$/.test(n)||/build\.gradle/.test(n))?'native':names.includes('index.html')||names.some(n=>/\.html?$/.test(n))?'html':'blank';
    const name=file.name.replace(/\.zip$/i,'').replace(/[-_]+/g,' ').slice(0,40)||'Imported project';
    const p=newProjectObj({name,type,files});
    addLog('Imported project '+name);
    toast('Imported '+names.length+' files','ok');openProject(p.id);
  }catch(err){toast('Could not read that ZIP file.','err')}
}

function syncScroll(){const ta=$('#ta');if(!ta)return;const h=$('#hl');h.scrollTop=ta.scrollTop;h.scrollLeft=ta.scrollLeft;$('#gut').scrollTop=ta.scrollTop}

function bindEditor(){
  const ta=$('#ta'),p=curProject();if(!ta||!p)return;
  paintEditor();
  ta.addEventListener('scroll',syncScroll);
  ta.addEventListener('input',()=>{p.files[S.tab]=ta.value;p.updated=now();S.saved=false;setSaved();paintEditor();clearTimeout(saveT);saveT=setTimeout(commitSave,1200);if(S.live){clearTimeout(prevT);prevT=setTimeout(refreshPreview,700)}});
  const ins=t=>{if(!document.execCommand('insertText',false,t)){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}};
  ta.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();commitSave();toast('Saved','ok');return}
    if(e.key==='Tab'){e.preventDefault();ins('  ')}
    else if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
      const s=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',s-1)+1,ind=(v.slice(ls,s).match(/^[ \t]*/)||[''])[0];
      e.preventDefault();ins('\n'+ind+(v.charAt(s-1)==='{'?'  ':''));
    }
  });
}

function readImage(file,mode){

    const img=new Image(),u=URL.createObjectURL(file);
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};
    img.onload=()=>{

      if(mode==='icon'){cv.width=cv.height=512;const k=Math.max(512/img.width,512/img.height);c.drawImage(img,(512-img.width*k)/2,(512-img.height*k)/2,img.width*k,img.height*k);res(cv.toDataURL('image/png'))}
      else{const k=Math.min(1,1080/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);c.drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.85))}
      URL.revokeObjectURL(u);
    };
    img.src=u;
  });
}

async function runBuild(b){

  const log=(m,cls)=>{b.logs.push([now(),m,cls||'']);paintConsole()};

    db.builds.push({id:b.id,uid:S.uid,name:b.cfg.name,pkg:b.cfg.pkg,ver:b.cfg.vname,size:b.size,status:'success',at:now(),mode:b.api?'server':'demo'});

async function remoteBuild(b,log){
  const api=db.settings.buildApi.replace(/\/$/,'');
  log('Contacting build server…');
  const fd=new FormData();
  fd.append('config',JSON.stringify(Object.assign({},b.cfg,{icon:b.icon||'',manifest:genManifest(b.cfg)})));
  if(b.files&&needZip())fd.append('source',await zipOf(b.files),'source.zip');else if(b.zip)fd.append('source',b.zip,b.zip.name);
  let r;try{r=await fetch(api,{method:'POST',body:fd})}catch(e){throw new Error('Cannot reach the build server. Check the endpoint in Admin → Settings.')}
  if(!r.ok)throw new Error('Build server answered '+r.status+'.');
  const {id}=await r.json();let seen=0;
  for(let i=0;i<300;i++){
    if(b.cancelled)return;await sleep(2000);
    const s=await (await fetch(api+'/status/'+encodeURIComponent(id))).json();
    (s.logs||[]).slice(seen).forEach(l=>log(l));seen=(s.logs||[]).length;
    const map={queued:0,connect:0,configure:1,package:2,sign:3,done:4};b.step=map[s.step]!=null?map[s.step]:b.step;
    if(s.state==='failed')throw new Error(s.error||'The build server reported a failure.');
    if(s.state==='done'){b.url=s.downloadUrl;b.size=s.size||0;return}
  }
  throw new Error('The build timed out.');
}

  else{c.fillStyle='#fff';c.font='700 '+(im.t.length>1?220:300)+'px Unbounded, system-ui, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(im.t,s/2,s/2+8)}
  c.restore();
}

function convertCode(src,o){
  let s=src;
  if(o.con)s=s.replace(/console\.(log|info|debug|warn)\s*\([^;\n]*\)\s*;?/g,'');
  if(o.min){
    s=s.replace(/<!--[\s\S]*?-->/g,'').replace(/\/\*[\s\S]*?\*\//g,'').split('\n').filter(l=>!/^\s*\/\//.test(l)).map(l=>l.trim()).filter(Boolean).join('\n').replace(/>\s+</g,'><').replace(/[ \t]{2,}/g,' ');
  }
  if(o.wrap)s='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>document.open();document.write(decodeURIComponent(escape(atob("'+btoa(unescape(encodeURIComponent(s)))+'"))));document.close()<\/script>';
  return s;
}

function barChart(days){
  const W=440,H=176,L=30,B=24,T=12,max=Math.max(1,...days.map(d=>d.ok+d.fail)),top=Math.ceil(max/4)*4,bw=(W-L-8)/days.length,ph=H-B-T;
  let g='';for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+='<line class="gl" x1="'+L+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+(top*i/4)+'</text>'}
  const bars=days.map((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,hs=ph*d.ok/top,hf=ph*d.fail/top,y0=T+ph;return '<rect class="bar" x="'+x+'" y="'+(y0-hs)+'" width="'+w+'" height="'+hs+'" rx="4"/>'+(d.fail?'<rect class="bar f" x="'+x+'" y="'+(y0-hs-hf)+'" width="'+w+'" height="'+hf+'" rx="4"/>':'')+'<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+d.l+'</text>'+((d.ok+d.fail)?'<text x="'+(x+w/2)+'" y="'+(y0-hs-hf-4)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+(d.ok+d.fail)+'</text>':'')}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Builds per day, last 7 days">'+g+bars+'</svg>';
}

function meter(v){
  let s=0;if(v.length>=8)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const m=$('#meter');if(!m)return;m.dataset.s=s;[...m.children].forEach((x,i)=>x.classList.toggle('on',i<s&&v.length>0));
  $('#meterlbl').textContent=!v?'Use 8+ characters with letters, numbers and a symbol.':['Too weak','Weak','Okay','Strong','Very strong'][s];
}

  if(t.name==='np-type'){$('#np-urlf').hidden=t.value!=='webview';$('#np-langf').hidden=t.value!=='native'}

const VIEWS={home:homeView,projects:projectsView,editor:editorView,build:buildView,console:consoleView,store:storeView,lab:labView,converter:converterView,wallet:walletView,payments:paymentsView,plans:plansView,profile:profileView,about:aboutView,admin:adminView};
function go(r){if(location.hash==='#'+r)render();else location.hash=r}
function render(){
  const lm=localStorage.getItem('arapk.layout.v1')||'auto';document.documentElement.dataset.layout=lm==='auto'?(innerWidth<=959?'mobile':'desktop'):lm;
  let r=(location.hash||'#home').slice(1).split('/')[0]||'home';
  if(r!=='login'&&!VIEWS[r])r='home';
  const fix=x=>{history.replaceState(null,'','#'+x);r=x};
  if(['wallet','payments','profile','admin'].includes(r)&&!me()){S.next=r;S.authTab='login';fix('login')}
  if(r==='admin'&&!isAdmin()){toast('Admin access only','err');fix('home')}
  if(r==='console'&&!S.build)fix('build');
  if(r==='login'&&me())fix('home');
  const y=window.scrollY,same=S.last===r;S.route=r;
  $('#root').innerHTML=r==='login'?authView():shell(VIEWS[r]());
  const lsel=$('#layout-mode');if(lsel)lsel.value=localStorage.getItem('arapk.layout.v1')||'auto';
  window.scrollTo(0,same?y:0);S.last=r;
  const cv=$('#cv');if(cv)conveyor(cv,r==='login'?.78:null,r==='login'?.4:null);
  if(r==='editor'){bindEditor();refreshPreview()}
  if(r==='console'&&S.build&&S.build.state==='new'){runBuild(S.build)}else if(r==='console')paintConsole();
  if(S.focusQ){S.focusQ=false;const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
async function boot(){
  const th=store.get(TKEY);if(th)document.documentElement.dataset.theme=th;
  db=store.get(KEY);
  if(!db||!db.users){db=await seed();save()}
  db.hidden=db.hidden||[];db.templates=db.templates||[];db.log=db.log||[];
  const sid=store.get(SKEY);if(sid&&db.users.some(u=>u.id===sid&&u.status!=='banned'))S.uid=sid;
  S.cfg=Object.assign({},CFG0,store.get(CKEY)||{});
  addEventListener('hashchange',render);
  addEventListener('resize',()=>{if((localStorage.getItem('arapk.layout.v1')||'auto')==='auto'){document.documentElement.dataset.layout=innerWidth<=959?'mobile':'desktop'}});
  document.addEventListener('change',e=>{if(e.target&&e.target.id==='layout-mode'){localStorage.setItem('arapk.layout.v1',e.target.value);document.documentElement.dataset.layout=e.target.value==='auto'?(innerWidth<=959?'mobile':'desktop'):e.target.value;render()}});
  render();
}
boot();

</script>
